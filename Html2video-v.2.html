    const DEMO_CODE = `function drawScene(ctx, time, audioLevel, width, height) {
  const minDim = Math.min(width, height);
  const cx = width * 0.5;
  const cy = height * 0.5;
  const progress = (time % 5) / 5;
  const shiftX = Math.sin(time * 1.4) * minDim * 0.14;
  const shiftY = Math.cos(time * 1.1) * minDim * 0.14;

  const bgGrad = ctx.createRadialGradient(
    cx + shiftX,
    cy + shiftY,
    minDim * 0.04,
    cx,
    cy,
    Math.max(width, height) * 0.78
  );
  bgGrad.addColorStop(0, '#312e81');
  bgGrad.addColorStop(0.45, '#0f172a');
  bgGrad.addColorStop(1, '#020617');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);

  const glowAlpha = 0.22 + audioLevel * 0.55;
  const pulseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * (0.38 + audioLevel * 0.18));
  pulseGrad.addColorStop(0, 'rgba(139, 92, 246, ' + glowAlpha.toFixed(3) + ')');
  pulseGrad.addColorStop(0.6, 'rgba(14, 165, 233, ' + (glowAlpha * 0.4).toFixed(3) + ')');
  pulseGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = pulseGrad;
  ctx.fillRect(0, 0, width, height);

  const ringRadius = minDim * (0.24 + audioLevel * 0.08);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(time * 0.6);

  ctx.beginPath();
  ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(56, 189, 248, ' + (0.45 + audioLevel * 0.5).toFixed(3) + ')';
  ctx.lineWidth = minDim * (0.008 + audioLevel * 0.012);
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = minDim * 0.04;
  ctx.stroke();

  const barCount = 40;
  for (let i = 0; i < barCount; i++) {
    const angle = (i / barCount) * Math.PI * 2;
    const wave = Math.sin(time * 5 + i * 0.65) * 0.5 + 0.5;
    const barLen = minDim * (0.018 + (audioLevel * 0.09 + 0.015) * wave);
    const innerR = ringRadius + minDim * 0.025;
    const outerR = innerR + barLen;

    ctx.beginPath();

    ctx.lineWidth = minDim * 0.006;
    ctx.lineCap = 'round';
    ctx.stroke();

  const slideIn = Math.min(1, time / 0.6);
  const ease = 1 - Math.pow(1 - slideIn, 3);
  const titleY = cy - minDim * 0.01 + floatY + (1 - ease) * minDim * 0.08;

  ctx.globalAlpha = ease;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '800 ' + titleSize + 'px Inter, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(99, 102, 241, 0.85)';
  ctx.shadowBlur = minDim * 0.03;
  ctx.fillText('CANVAS STUDIO', cx, titleY);

  const subSize = Math.round(minDim * 0.028);
  ctx.font = '600 ' + subSize + 'px Inter, sans-serif';
  ctx.fillStyle = '#cbd5e1';
  ctx.shadowBlur = 0;

  ctx.restore();

  const barH = Math.max(4, minDim * 0.008);
  const barX = (width - barW) * 0.5;
  const barY = height * 0.88;

  ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(barX, barY, barW * progress, barH);
}`;

        el.htmlLiveAspectBox.style.width = '100%';

        el.btnToggleHtmlFit.textContent = 'Penuh';
        return;
      }
      const rect = el.previewStage.getBoundingClientRect();
      const maxW = Math.max(120, rect.width - 16);
      const maxH = Math.max(120, rect.height - 16);
      const targetRatio = state.presetWidth / state.presetHeight;
      let boxW = maxW;
      let boxH = boxW / targetRatio;
      if (boxH > maxH) {
        boxH = maxH;
        boxW = boxH * targetRatio;

      el.htmlLiveAspectBox.style.width = Math.floor(boxW) + 'px';
      el.htmlLiveAspectBox.style.height = Math.floor(boxH) + 'px';

        stageCanvas._dispatch = function (type, ev) {

        let nextRafId = 1;

        const domListeners = [];

          now: function () {

          }
        };

          rafQueue.set(id, cb);
          return id;
        }

        function vCancelAnimationFrame(id) {

        const virtualWindow = {
          innerWidth: width,
          innerHeight: height,
          devicePixelRatio: 1,
          onload: null,
          AudioContext: window.AudioContext,
          webkitAudioContext: window.webkitAudioContext,
          requestAnimationFrame: vRequestAnimationFrame,
          cancelAnimationFrame: vCancelAnimationFrame,
          setTimeout: window.setTimeout.bind(window),
          clearTimeout: window.clearTimeout.bind(window),

          clearInterval: window.clearInterval.bind(window),

          documentElement: virtualDocEl,

          querySelector: function (sel) {

          }

          const entries = Array.from(rafQueue.entries());
          rafQueue.clear();
          for (let i = 0; i < entries.length; i++) {

            }

        return {
          width: width,
          height: height,
          stageCanvas: stageCanvas,
          virtualWindow: virtualWindow,
          lastTime: 0,
          nextEventIdx: 0,

      return function drawSceneFromHtml(ctx, time, audioLevel, width, height) {

        session.virtualWindow.__audioLevel = audioLevel;
        const delta = time - session.lastTime;

    function compileCassetteCode(rawCode) {
      try {
        const trimmed = rawCode
          .trim()
          .replace(/^```[a-zA-Z0-9_-]*\s*\n?/, '')
          .replace(/\n?```\s*$/, '')
          .trim();
        if (!trimmed) {
          state.drawFn = null;
          state.isHtmlCassette = false;
          state.rawHtmlCode = '';
          state.previewMode = 'timeline';
          setCodeBadge(false);
          updatePreviewModeUI();
          showBox(el.codeStatusBox, 'Editor kode masih kosong. Tempel fungsi drawScene, kode HTML Canvas, atau tekan Load Demo.', 'error');
          return false;
        }

        const looksLikeHtml = /<!doctype\s+html/i.test(trimmed) || /<html[\s>]/i.test(trimmed) || (/<canvas[\s>]/i.test(trimmed) && /<script[\s>]/i.test(trimmed));

        let usedHtmlAdapter = false;

        if (looksLikeHtml) {
          const scriptTagRegex = new RegExp('<script\\b([^>]*)>([\\s\\S]*?)<' + '/script>', 'gi');

          let m;
          while ((m = scriptTagRegex.exec(trimmed)) !== null) {
            if (!/\bsrc\s*=/i.test(m[1] || '')) {

            }
          }
          const combined = scriptBodies.join('\n').replace(/^\s*export\s+(default\s+)?/gm, '').trim();
          if (/function\s+drawScene\b|drawScene\s*=/.test(combined)) {
            const factory = new Function(combined + '\nreturn typeof drawScene === "function" ? drawScene : null;');

          } else {
            fn = compileHtmlCanvasCassette(trimmed);
            usedHtmlAdapter = true;
          }
        } else {
          const cleaned = sanitizeUserCode(trimmed);
          if (!cleaned) {
            state.drawFn = null;
            state.isHtmlCassette = false;
            state.rawHtmlCode = '';
            state.previewMode = 'timeline';
            setCodeBadge(false);
            updatePreviewModeUI();
            showBox(el.codeStatusBox, 'Editor kode masih kosong. Tempel fungsi drawScene atau tekan Load Demo.', 'error');
            return false;
          }

          const factory = new Function(
            cleaned + '\nreturn typeof drawScene === "function" ? drawScene : null;'
          );
          fn = factory();
          if (typeof fn !== 'function') {
            state.drawFn = null;
            state.isHtmlCassette = false;
            state.rawHtmlCode = '';
            state.previewMode = 'timeline';
            setCodeBadge(false);
            updatePreviewModeUI();

          state.rawHtmlCode = trimmed;

          }

    function getAudioLevelAt(timeSec) {
      if (!state.audioLevels || state.audioLevels.length === 0) {
        return 0;
      }
      const pos = Math.max(0, timeSec * 60);
      const idx0 = Math.floor(pos);
      const idx1 = Math.min(state.audioLevels.length - 1, idx0 + 1);
      if (idx0 >= state.audioLevels.length) {
        return 0;
      }
      const frac = pos - idx0;
      const v0 = state.audioLevels[idx0] || 0;
      const v1 = state.audioLevels[idx1] || 0;
      return v0 + (v1 - v0) * frac;
    }

    function executeDrawScene(ctx, time, audioLevel, width, height) {

        ctx.fillStyle = '#09090b';
        ctx.fillRect(0, 0, width, height);
        return false;
      }
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);
      try {
        state.drawFn(ctx, time, audioLevel, width, height);
        return true;
      } finally {
        ctx.restore();
      }
    }

    function resizePreviewCanvas() {
      if (el.previewCanvas.width !== state.presetWidth || el.previewCanvas.height !== state.presetHeight) {
        el.previewCanvas.width = state.presetWidth;
        el.previewCanvas.height = state.presetHeight;

    function renderPreviewFrame(timeSec) {

    function getOrCreateAudioContext() {

    function decodeAudioBufferCompat(ctx, arrayBuffer) {
      const cloned = arrayBuffer.slice(0);
      return new Promise((resolve, reject) => {
        try {
          const maybePromise = ctx.decodeAudioData(cloned, resolve, reject);
          if (maybePromise && typeof maybePromise.then === 'function') {
            maybePromise.then(resolve).catch(reject);
          }
        } catch (err) {
          reject(err);
        }
      });
    }

    function extractRmsLevels(audioBuffer) {
      const sampleRate = audioBuffer.sampleRate;
      const samplesPerBin = Math.max(1, Math.floor(sampleRate / 60));
      const totalSamples = audioBuffer.length;
      const totalBins = Math.ceil(totalSamples / samplesPerBin);
      const rawRms = new Float32Array(totalBins);
      const numChannels = audioBuffer.numberOfChannels;
      const channels = [];
      for (let c = 0; c < numChannels; c++) {
        channels.push(audioBuffer.getChannelData(c));
      }

      let peak = 0;
      for (let b = 0; b < totalBins; b++) {
        const start = b * samplesPerBin;
        const end = Math.min(totalSamples, start + samplesPerBin);
        let sumSq = 0;
        let count = 0;
        for (let i = start; i < end; i++) {
          let mono = 0;
          for (let c = 0; c < numChannels; c++) {
            mono += channels[c][i];
          }
          mono /= numChannels;
          sumSq += mono * mono;
          count++;
        }
        const rms = count > 0 ? Math.sqrt(sumSq / count) : 0;
        rawRms[b] = rms;
        if (rms > peak) {
          peak = rms;
        }
      }

      const normalized = new Float32Array(totalBins);
      if (peak > 0.00001) {
        for (let b = 0; b < totalBins; b++) {
          normalized[b] = Math.min(1, rawRms[b] / peak);
        }
      }
      return normalized;
    }

    async function handleAudioUpload(file) {
      if (!file) {
        return;
      }
      pausePlayback();
      el.audioFileName.textContent = 'Memproses audio...';
      try {
        const ctx = getOrCreateAudioContext();
        const arrayBuf = await file.arrayBuffer();
        const decoded = await decodeAudioBufferCompat(ctx, arrayBuf);
        state.audioBuffer = decoded;
        state.audioLevels = extractRmsLevels(decoded);
        state.duration = Math.max(0.5, Number(decoded.duration.toFixed(2)));
        el.durationInput.value = String(state.duration);
        el.audioDurationHint.textContent = `Tersinkron dengan audio (${state.duration.toFixed(2)} dtk)`;
        el.audioFileName.textContent = file.name;

    async function startPlayback() {
      if (state.isRendering) {
        return;
      }
      if (state.currentTime >= state.duration - 0.01) {
        state.currentTime = 0;
      }

      stopAudioSource();

      if (state.audioBuffer) {
        const ctx = getOrCreateAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        const source = ctx.createBufferSource();
        source.buffer = state.audioBuffer;
        source.connect(ctx.destination);
        const offset = Math.min(state.currentTime, Math.max(0, state.audioBuffer.duration - 0.01));
        state.playStartCtxTime = ctx.currentTime;
        state.playStartOffset = state.currentTime;
        source.start(0, offset);
        state.audioSource = source;
      } else {
        state.playStartPerfTime = performance.now();
        state.playStartOffset = state.currentTime;
      }

      state.isPlaying = true;
      updatePlayButtonUI();
      schedulePlaybackTick();
    }

    function pausePlayback() {

    function schedulePlaybackTick() {
      if (!state.isPlaying) {
        return;
      }

        if (!state.isPlaying) {

        }
        let elapsed = 0;
        if (state.audioBuffer && state.audioCtx) {
          elapsed = state.audioCtx.currentTime - state.playStartCtxTime;
        } else {
          elapsed = (performance.now() - state.playStartPerfTime) / 1000;
        }
        const nextTime = state.playStartOffset + elapsed;
        if (nextTime >= state.duration) {
          state.currentTime = state.duration;
          pausePlayback();
          renderPreviewFrame(state.currentTime);
          return;
        }
        state.currentTime = nextTime;
        renderPreviewFrame(state.currentTime);
        schedulePlaybackTick();
      });
    }

    function drawCanvasContain(targetCtx, sourceCanvas, targetW, targetH) {

      const scale = Math.min(targetW / sw, targetH / sh);

      const dh = sh * scale;

      if (!bridge || !sourceCanvas) {

      const height = state.presetHeight;

        if (hasAudioTrack) {
          muxerOptions.audio = {
            codec: 'aac',
            numberOfChannels: audioConfig.numberOfChannels,
            sampleRate: audioConfig.sampleRate
          };
        }
        muxer = new Muxer(muxerOptions);
        videoEncoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: (err) => { fatalError = err; }
        });
        videoEncoder.configure(videoConfig);
      } else {
        if (typeof MediaRecorder === 'undefined' || typeof offCanvas.captureStream !== 'function') {
          showBox(el.previewErrorBox, 'Browser ini tidak mendukung perekaman kanvas langsung.', 'error');
          return;
        }
        const canvasStream = offCanvas.captureStream(fps);
        mediaStreamTracks = [...canvasStream.getVideoTracks()];
        if (state.audioBuffer) {
          const ctx = getOrCreateAudioContext();
          if (ctx.state === 'suspended') {
            await ctx.resume();
          }
          const streamDest = ctx.createMediaStreamDestination();
          recAudioSource = ctx.createBufferSource();
          recAudioSource.buffer = state.audioBuffer;
          recAudioSource.connect(streamDest);
          recAudioSource.connect(ctx.destination);
          streamDest.stream.getAudioTracks().forEach((t) => mediaStreamTracks.push(t));
        }
        const combinedStream = new MediaStream(mediaStreamTracks);
        const chosenMime = pickMediaRecorderMimeType();
        const targetBitrate = getTargetVideoBitrate(width, height, fps);
        const recOpts = chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: targetBitrate } : { videoBitsPerSecond: targetBitrate };
        mediaRecorder = new MediaRecorder(combinedStream, recOpts);
        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) {
            mediaChunks.push(ev.data);
          }
        };
      }

      if (useWebCodecs && state.audioBuffer) {
        const ctx = getOrCreateAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        recAudioSource = ctx.createBufferSource();
        recAudioSource.buffer = state.audioBuffer;
        recAudioSource.connect(ctx.destination);
        recAudioSource.start(0, 0);
      } else if (!useWebCodecs && recAudioSource) {
        recAudioSource.start(0, 0);
      }

      bridge.startRecording();
      state.liveRecStartPerf = performance.now();
      setLiveRecordUI(true);

      let frameCounter = 0;
      let lastTimestampUs = -1;
      const frameDurationUs = Math.round((1 / fps) * 1000000);
      const intervalMs = Math.max(4, Math.round(1000 / fps));
      let captureTimerId = null;

      if (mediaRecorder) {
        mediaRecorder.start(250);
      }

      function captureTick() {
        if (!state.isLiveRecording || fatalError) {
          return;
        }
        const liveCanvas = bridge.getCanvas() || sourceCanvas;
        drawCanvasContain(offCtx, liveCanvas, width, height);

        if (useWebCodecs && videoEncoder) {
          if (videoEncoder.encodeQueueSize <= 4) {
            const elapsedUs = Math.round((performance.now() - state.liveRecStartPerf) * 1000);
            const tsUs = Math.max(lastTimestampUs + 1000, elapsedUs);
            lastTimestampUs = tsUs;
            const frame = new VideoFrame(offCanvas, {
              timestamp: tsUs,
              duration: frameDurationUs
            });
            videoEncoder.encode(frame, { keyFrame: frameCounter % (fps * 2) === 0 });
            frame.close();
            frameCounter++;
          }
        }
      }

      captureTick();
      captureTimerId = window.setInterval(captureTick, intervalMs);

      state.liveRecTimerId = window.setInterval(() => {
        if (!state.isLiveRecording) {
          return;
        }
        const sec = (performance.now() - state.liveRecStartPerf) / 1000;
        const count = bridge.getEventsCount ? bridge.getEventsCount() : 0;
        el.liveRecTimerText.textContent = formatTime(sec) + '.' + Math.floor((sec % 1) * 10);
        el.liveRecBadgeText.textContent = 'REC ' + formatTime(sec) + ' · ' + count;
      }, 100);

      state.liveRecStopHandler = async function () {
        if (!state.isLiveRecording) {
          return;
        }
        state.isLiveRecording = false;
        window.clearInterval(captureTimerId);
        window.clearInterval(state.liveRecTimerId);
        state.liveRecTimerId = null;

        if (recAudioSource) {
          try {
            recAudioSource.stop();
            recAudioSource.disconnect();
          } catch (e) {}
          recAudioSource = null;
        }

        const recordedSec = Math.max(0.5, Number(((performance.now() - state.liveRecStartPerf) / 1000).toFixed(2)));
        const recordedEvents = bridge.stopRecording ? bridge.stopRecording() : [];
        state.recordedInteractions = recordedEvents;

        if (!state.audioBuffer) {
          state.duration = recordedSec;
          el.durationInput.value = String(recordedSec);
          updateHeaderMeta();
          syncTimelineUI();
        }

        el.liveRecBtnLabel.textContent = 'Menyusun Video...';
        el.btnLiveRecord.disabled = true;

        try {
          if (useWebCodecs) {
            if (fatalError) {
              throw fatalError;
            }
            if (hasAudioTrack) {
              const audioEncoder = new AudioEncoder({
                output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
                error: (err) => { fatalError = err; }
              });
              audioEncoder.configure(audioConfig);
              await encodeAudioBufferToEncoder(
                audioEncoder,
                state.audioBuffer,
                Math.min(recordedSec, state.audioBuffer.duration),
                audioConfig.numberOfChannels
              );
              await audioEncoder.flush();
              audioEncoder.close();
            }
            await videoEncoder.flush();
            videoEncoder.close();
            muxer.finalize();
            const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
            showRenderResult(blob, `canvas-studio-live-${width}x${height}.mp4`, 'video/mp4');
            if (state.audioBuffer && !hasAudioTrack) {
              showBox(el.exportStatusBox, 'Mode video-only (Safari iOS): gabungkan audio di CapCut/aplikasi edit', 'info');
            } else {
              showBox(el.exportStatusBox, `Rekaman sentuhan interaktif selesai (${recordedEvents.length} aksi, ${recordedSec.toFixed(1)}s)!`, 'success');
            }
          } else {
            await new Promise((resolve, reject) => {
              mediaRecorder.onerror = (ev) => reject(ev.error || new Error('MediaRecorder error'));
              mediaRecorder.onstop = () => {
                const finalMime = mediaRecorder.mimeType || 'video/mp4';
                const ext = finalMime.includes('webm') ? 'webm' : 'mp4';
                const blob = new Blob(mediaChunks, { type: finalMime });
                showRenderResult(blob, `canvas-studio-live-${width}x${height}.${ext}`, finalMime);
                showBox(el.exportStatusBox, `Rekaman sentuhan interaktif selesai (${recordedEvents.length} aksi, ${recordedSec.toFixed(1)}s)!`, 'success');
                resolve();
              };
              if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
              } else {
                resolve();
              }
            });
            mediaStreamTracks.forEach((t) => {
              try {
                t.stop();
              } catch (e) {}
            });
          }

          setLiveRecordUI(false);
          el.btnLiveRecord.disabled = false;
          updateRecordedTouchUI();
          switchTab('export');
        } catch (err) {
          try {
            if (videoEncoder && videoEncoder.state !== 'closed') {
              videoEncoder.close();
            }
          } catch (e) {}
          mediaStreamTracks.forEach((t) => {
            try {
              t.stop();
            } catch (e) {}
          });
          setLiveRecordUI(false);
          el.btnLiveRecord.disabled = false;
          const msg = err && err.message ? err.message : 'Gagal merekam video interaktif.';
          showBox(el.previewErrorBox, 'Gagal mengekspor rekaman sentuhan: ' + msg, 'error');
        }
      };
    }

    function getTargetVideoBitrate(width, height, fps) {
      const pixelArea = width * height;
      const baseBitrate = pixelArea > 1280 * 720 ? 8000000 : 5000000;
      if (fps >= 120) {
        return Math.round(baseBitrate * 2.2);
      }
      if (fps >= 90) {
        return Math.round(baseBitrate * 1.8);
      }
      if (fps >= 60) {
        return Math.round(baseBitrate * 1.4);
      }
      return baseBitrate;
    }

    async function findSupportedVideoConfig(width, height, fps) {
      let codecs;
      if (fps >= 120) {
        codecs = ['avc1.4d0034', 'avc1.640034', 'avc1.4d0033', 'avc1.640033', 'avc1.4d003c', 'avc1.64003c', 'avc1.4d002a', 'avc1.640028', 'avc1.42001f'];
      } else if (fps >= 90) {
        codecs = ['avc1.4d0033', 'avc1.640033', 'avc1.4d0034', 'avc1.640034', 'avc1.4d002a', 'avc1.640028', 'avc1.42001f'];
      } else {
        codecs = ['avc1.4d002a', 'avc1.42001f', 'avc1.4d0033', 'avc1.640028'];
      }
      const bitrate = getTargetVideoBitrate(width, height, fps);

      for (const codec of codecs) {
        const config = {
          codec,
          width,
          height,
          bitrate,
          framerate: fps
        };
        try {
          const support = await VideoEncoder.isConfigSupported(config);
          if (support && support.supported) {
            return support.config || config;
          }
        } catch (err) {}
      }
      return null;
    }

    async function checkAudioEncoderSupport(audioBuffer) {
      if (!audioBuffer || typeof AudioEncoder === 'undefined') {
        return null;
      }
      const sampleRate = audioBuffer.sampleRate;
      const numberOfChannels = Math.min(2, audioBuffer.numberOfChannels);
      const config = {
        codec: 'mp4a.40.2',
        sampleRate,
        numberOfChannels,
        bitrate: 128000
      };
      try {
        const support = await AudioEncoder.isConfigSupported(config);
        if (support && support.supported) {
          return support.config || config;
        }
      } catch (err) {}
      return null;
    }

    async function encodeAudioBufferToEncoder(audioEncoder, audioBuffer, durationSec, numberOfChannels) {
      const sampleRate = audioBuffer.sampleRate;
      const totalSamples = Math.min(audioBuffer.length, Math.floor(durationSec * sampleRate));
      const chunkSize = 1024;
      const channelData = [];
      for (let c = 0; c < numberOfChannels; c++) {
        channelData.push(audioBuffer.getChannelData(Math.min(c, audioBuffer.numberOfChannels - 1)));
      }

      for (let offset = 0; offset < totalSamples; offset += chunkSize) {
        if (state.renderCancelled) {
          return;
        }
        while (audioEncoder.encodeQueueSize > 8) {
          if (state.renderCancelled) {
            return;
          }
          await new Promise((r) => setTimeout(r, 15));
        }
        const frames = Math.min(chunkSize, totalSamples - offset);
        const planar = new Float32Array(frames * numberOfChannels);
        for (let c = 0; c < numberOfChannels; c++) {
          planar.set(channelData[c].subarray(offset, offset + frames), c * frames);
        }
        const timestampUs = Math.round((offset / sampleRate) * 1000000);
        const audioData = new AudioData({
          format: 'f32-planar',
          sampleRate,
          numberOfFrames: frames,
          numberOfChannels,
          timestamp: timestampUs,
          data: planar
        });
        audioEncoder.encode(audioData);
        audioData.close();

        if ((offset / chunkSize) % 24 === 0) {
          await new Promise((r) => setTimeout(r, 0));
        }
      }
    }

    async function runWebCodecsRender() {
      if (muxerLoadError || !Muxer || !ArrayBufferTarget) {
        throw new Error('Library mp4-muxer gagal dimuat dari CDN. Periksa koneksi internet Anda.');
      }
      if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') {
        throw new Error('WebCodecs VideoEncoder tidak didukung oleh browser ini. Gunakan Safari iOS 16.4+ atau pilih Mode Real-time (MediaRecorder).');
      }

      const width = state.presetWidth;
      const height = state.presetHeight;
      const fps = state.fps;
      const duration = state.duration;
      const totalFrames = Math.max(1, Math.ceil(duration * fps));

      const videoConfig = await findSupportedVideoConfig(width, height, fps);
      if (!videoConfig) {
        throw new Error('Tidak ada profil codec H.264 (avc1) yang didukung untuk resolusi ' + width + 'x' + height + ' @ ' + fps + ' FPS. Coba turunkan FPS atau resolusi.');
      }

      const audioConfig = await checkAudioEncoderSupport(state.audioBuffer);
      const hasAudioTrack = Boolean(state.audioBuffer && audioConfig);

      if (state.audioBuffer && !audioConfig) {
        showBox(el.exportStatusBox, 'Mode video-only (Safari iOS): gabungkan audio di CapCut/aplikasi edit', 'info');
      } else {
        hideBox(el.exportStatusBox);
      }

      const muxerOptions = {
        target: new ArrayBufferTarget(),
        video: {
          codec: 'avc',
          width,
          height
        },
        fastStart: 'in-memory',
        firstTimestampBehavior: 'offset'
      };

      if (hasAudioTrack) {
        muxerOptions.audio = {
          codec: 'aac',
          numberOfChannels: audioConfig.numberOfChannels,
          sampleRate: audioConfig.sampleRate
        };
      }

      const muxer = new Muxer(muxerOptions);
      let fatalEncoderError = null;

      const videoEncoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (err) => {
          fatalEncoderError = err;
        }
      });
      videoEncoder.configure(videoConfig);

      let audioEncoder = null;
      if (hasAudioTrack) {
        audioEncoder = new AudioEncoder({
          output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
          error: (err) => {
            fatalEncoderError = err;
          }
        });
        audioEncoder.configure(audioConfig);
      }

      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d', { alpha: false });

      try {
        for (let i = 0; i < totalFrames; i++) {
          if (state.renderCancelled) {
            throw new Error('CANCELLED');
          }
          if (fatalEncoderError) {
            throw fatalEncoderError;
          }

          while (videoEncoder.encodeQueueSize > 4) {
            if (state.renderCancelled) {
              throw new Error('CANCELLED');
            }
            if (fatalEncoderError) {
              throw fatalEncoderError;
            }
            await new Promise((r) => setTimeout(r, 15));
          }

          const timeSec = i / fps;
          const level = getAudioLevelAt(timeSec);
          executeDrawScene(offCtx, timeSec, level, width, height);

          const timestampUs = Math.round((i / fps) * 1000000);
          const frameDurationUs = Math.round((1 / fps) * 1000000);
          const frame = new VideoFrame(offCanvas, {
            timestamp: timestampUs,
            duration: frameDurationUs
          });

          const keyFrame = i % (fps * 2) === 0;
          videoEncoder.encode(frame, { keyFrame });
          frame.close();

          updateRenderProgress(i + 1, totalFrames);

          if (i % 3 === 0) {
            await new Promise((r) => setTimeout(r, 0));
          }
        }

        if (hasAudioTrack && audioEncoder) {
          await encodeAudioBufferToEncoder(
            audioEncoder,
            state.audioBuffer,
            duration,
            audioConfig.numberOfChannels
          );
          if (state.renderCancelled) {
            throw new Error('CANCELLED');
          }
          await audioEncoder.flush();
          audioEncoder.close();
        }

        if (fatalEncoderError) {
          throw fatalEncoderError;
        }

        await videoEncoder.flush();
        videoEncoder.close();
        muxer.finalize();

        const buffer = muxer.target.buffer;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        showRenderResult(blob, `canvas-studio-${width}x${height}-${fps}fps.mp4`, 'video/mp4');

        if (!state.audioBuffer || hasAudioTrack) {
          showBox(el.exportStatusBox, `Render MP4 HD (${fps} FPS) selesai dengan sukses!`, 'success');
        }
      } catch (err) {
        try {
          if (videoEncoder.state !== 'closed') {
            videoEncoder.close();
          }
        } catch (e) {}
        try {
          if (audioEncoder && audioEncoder.state !== 'closed') {
            audioEncoder.close();
          }
        } catch (e) {}
        throw err;
      }
    }

    function pickMediaRecorderMimeType() {
      const candidates = [
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      if (typeof MediaRecorder === 'undefined') {
        return null;
      }
      for (const mime of candidates) {
        if (MediaRecorder.isTypeSupported(mime)) {
          return mime;
        }
      }
      return '';
    }

    async function runMediaRecorderRender() {
      if (typeof MediaRecorder === 'undefined') {
        throw new Error('MediaRecorder tidak didukung oleh browser ini.');
      }

      const width = state.presetWidth;
      const height = state.presetHeight;
      const fps = state.fps;
      const duration = state.duration;
      const totalFrames = Math.max(1, Math.ceil(duration * fps));

      const recCanvas = document.createElement('canvas');
      recCanvas.width = width;
      recCanvas.height = height;
      const recCtx = recCanvas.getContext('2d', { alpha: false });

      if (typeof recCanvas.captureStream !== 'function') {
        throw new Error('canvas.captureStream tidak didukung oleh browser ini.');
      }

      const canvasStream = recCanvas.captureStream(fps);
      const tracks = [...canvasStream.getVideoTracks()];
      let recAudioSource = null;

      if (state.audioBuffer) {
        const ctx = getOrCreateAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        const streamDest = ctx.createMediaStreamDestination();
        recAudioSource = ctx.createBufferSource();
        recAudioSource.buffer = state.audioBuffer;
        recAudioSource.connect(streamDest);
        recAudioSource.connect(ctx.destination);
        streamDest.stream.getAudioTracks().forEach((t) => tracks.push(t));
      }

      const combinedStream = new MediaStream(tracks);
      const chosenMime = pickMediaRecorderMimeType();
      const targetBitrate = getTargetVideoBitrate(width, height, fps);
      const recorderOptions = chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: targetBitrate } : { videoBitsPerSecond: targetBitrate };

      const recorder = new MediaRecorder(combinedStream, recorderOptions);
      const chunks = [];
      const finalMime = recorder.mimeType || chosenMime || 'video/mp4';

      showBox(el.exportStatusBox, 'Merekam secara real-time... Biarkan tab tetap terbuka hingga selesai.', 'info');

      await new Promise((resolve, reject) => {
        let animId = null;
        let finished = false;
        const startTime = performance.now();

        function cleanup() {
          if (animId !== null) {
            cancelAnimationFrame(animId);
            animId = null;
          }
          if (recAudioSource) {
            try {
              recAudioSource.stop();
              recAudioSource.disconnect();
            } catch (e) {}
            recAudioSource = null;
          }
          tracks.forEach((t) => {
            try {
              t.stop();
            } catch (e) {}
          });
        }

        recorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) {
            chunks.push(ev.data);
          }
        };

        recorder.onerror = (ev) => {
          if (!finished) {
            finished = true;
            cleanup();
            reject(ev.error || new Error('MediaRecorder mengalami kesalahan.'));
          }
        };

        recorder.onstop = () => {
          if (finished) {
            return;
          }
          finished = true;
          cleanup();
          if (state.renderCancelled) {
            reject(new Error('CANCELLED'));
            return;
          }
          const blob = new Blob(chunks, { type: finalMime });
          const ext = finalMime.includes('webm') ? 'webm' : 'mp4';
          showRenderResult(blob, `canvas-studio-${width}x${height}-${fps}fps.${ext}`, finalMime);
          showBox(el.exportStatusBox, 'Rekaman real-time selesai!', 'success');
          resolve();
        };

        if (recAudioSource) {
          recAudioSource.start(0, 0);
        }
        recorder.start(250);

        function tick() {
          if (state.renderCancelled) {
            if (recorder.state !== 'inactive') {
              recorder.stop();
            }
            return;
          }
          const elapsed = (performance.now() - startTime) / 1000;
          const clamped = Math.min(duration, elapsed);
          try {
            executeDrawScene(recCtx, clamped, getAudioLevelAt(clamped), width, height);
          } catch (err) {
            if (recorder.state !== 'inactive') {
              recorder.stop();
            }
            if (!finished) {
              finished = true;
              cleanup();
              reject(err);
            }
            return;
          }

          const approxFrame = Math.min(totalFrames, Math.floor(clamped * fps));
          updateRenderProgress(approxFrame, totalFrames);

          if (elapsed >= duration) {
            updateRenderProgress(totalFrames, totalFrames);
            if (recorder.state !== 'inactive') {
              recorder.stop();
            }
            return;
          }
          animId = requestAnimationFrame(tick);
        }

        animId = requestAnimationFrame(tick);
      });
    }

    async function handleStartRender() {
      if (state.isRendering) {
        return;
      }
      if (state.isPlaying) {
        pausePlayback();
      }
      if (!state.drawFn) {
        const ok = compileCassetteCode(el.codeEditor.value);
        if (!ok) {
          showBox(el.exportStatusBox, 'Perbaiki error pada kode kaset terlebih dahulu sebelum merender.', 'error');
          return;
        }
      }

      clearPreviousRenderResult();
      hideBox(el.exportStatusBox);
      state.renderCancelled = false;
      setRenderUIState(true);
      updateRenderProgress(0, Math.max(1, Math.ceil(state.duration * state.fps)));

      try {
        if (state.renderMode === 'webcodecs') {
          await runWebCodecsRender();
        } else {
          await runMediaRecorderRender();
        }
      } catch (err) {
        if (err && err.message === 'CANCELLED') {
          showBox(el.exportStatusBox, 'Render dibatalkan oleh pengguna.', 'warn');
        } else {
          const msg = err && err.message ? err.message : 'Terjadi kesalahan saat proses render.';
          showBox(el.exportStatusBox, 'Render gagal: ' + msg, 'error');
        }
      } finally {
        setRenderUIState(false);
      }
    }

    el.navBtns.forEach((btn) => {
      btn.addEventListener('click', () => {

      });

    el.durationInput.addEventListener('change', () => {

    function onScrubStart() {
      if (!state.isScrubbing) {
        state.isScrubbing = true;
        state.wasPlayingBeforeScrub = state.isPlaying;
        if (state.isPlaying) {
          pausePlayback();
        }
      }
    }

    function onScrubMove() {
      const val = parseFloat(el.seekSlider.value);
      state.currentTime = Number.isFinite(val) ? val : 0;
      renderPreviewFrame(state.currentTime);
    }

    function onScrubEnd() {
      if (state.isScrubbing) {
        state.isScrubbing = false;
        if (state.wasPlayingBeforeScrub) {
          startPlayback();
        }
      }
    }

    el.seekSlider.addEventListener('pointerdown', onScrubStart);
    el.seekSlider.addEventListener('touchstart', onScrubStart, { passive: true });
    el.seekSlider.addEventListener('input', onScrubMove);
    el.seekSlider.addEventListener('change', onScrubEnd);
    el.seekSlider.addEventListener('pointerup', onScrubEnd);
    el.seekSlider.addEventListener('touchend', onScrubEnd);

    el.presetSelect.addEventListener('change', () => {
      const parts = el.presetSelect.value.split('x');
      state.presetWidth = parseInt(parts[0], 10);
      state.presetHeight = parseInt(parts[1], 10);
      updateHeaderMeta();
      if (state.previewMode === 'interactive' && state.isHtmlCassette) {
        applyHtmlFrameSizing();
      } else {
        renderPreviewFrame(state.currentTime);
      }
    });

    el.btnModeInteractive.addEventListener('click', () => {
      if (state.isLiveRecording || !state.isHtmlCassette) {
        return;
      }
      if (state.isPlaying) {
        pausePlayback();
      }
      state.previewMode = 'interactive';
      updatePreviewModeUI();
    });

    el.btnModeTimeline.addEventListener('click', () => {
      if (state.isLiveRecording) {
        return;
      }
      state.previewMode = 'timeline';
      updatePreviewModeUI();
      renderPreviewFrame(state.currentTime);
    });

    el.btnToggleHtmlFit.addEventListener('click', () => {
      if (state.isLiveRecording) {
        return;
      }
      state.htmlAspectFit = !state.htmlAspectFit;
      applyHtmlFrameSizing();
    });

    el.btnLiveRecord.addEventListener('click', () => {
      if (state.isLiveRecording) {
        if (typeof state.liveRecStopHandler === 'function') {
          state.liveRecStopHandler();
        }
      } else {
        startLiveInteractiveRecording();
      }
    });

    el.btnLiveReload.addEventListener('click', () => {
      if (state.isLiveRecording || !state.rawHtmlCode) {
        return;
      }
      loadHtmlIntoLiveFrame(state.rawHtmlCode);
    });

    function clearRecordedTouches() {
      if (state.isLiveRecording) {
        return;
      }
      state.recordedInteractions = [];
      el.liveRecTimerText.textContent = '00:00.0';
      updateRecordedTouchUI();
      if (state.previewMode === 'timeline') {
        renderPreviewFrame(state.currentTime);
      }
    }

    el.btnClearTouches.addEventListener('click', clearRecordedTouches);
    el.btnExportClearTouches.addEventListener('click', clearRecordedTouches);

    window.addEventListener('resize', () => {
      if (state.activeTab === 'preview' && state.previewMode === 'interactive' && state.isHtmlCassette) {
        applyHtmlFrameSizing();
      }
    });

    el.fpsSelect.addEventListener('change', () => {
      state.fps = parseInt(el.fpsSelect.value, 10);
      updateHeaderMeta();
    });

    el.modeSelect.addEventListener('change', () => {
      state.renderMode = el.modeSelect.value;
    });

    el.btnStartRender.addEventListener('click', handleStartRender);

    el.btnCancelRender.addEventListener('click', () => {
      state.renderCancelled = true;
      showBox(el.exportStatusBox, 'Membatalkan proses render...', 'warn');
    });

    el.btnShareVideo.addEventListener('click', async () => {
      if (!state.renderedBlob) {
        return;
      }
      try {
        const file = new File([state.renderedBlob], state.renderedFileName, {
          type: state.renderedMimeType
        });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Canvas Video Studio'
          });
        } else {
          showBox(
            el.exportStatusBox,
            'Fitur Share File tidak didukung di browser ini. Silakan gunakan tombol "Download File".',
            'warn'
          );
        }
      } catch (err) {
        if (err && err.name !== 'AbortError') {
          showBox(
            el.exportStatusBox,
            'Gagal membuka menu Share: ' + err.message + '. Gunakan tombol "Download File".',
            'warn'
          );
        }
      }
    });

    el.codeEditor.value = DEMO_CODE;
    compileCassetteCode(DEMO_CODE);
    updateHeaderMeta();
    syncTimelineUI();
    switchTab('kode');
  </script>
</body>
</html>
